# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build

on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract release notes
      id: extract-release-notes
      uses: ffurrer2/extract-release-notes@v3

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      run: "gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --notes \"${{ steps.extract-release-notes.outputs.release_notes }}\""

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: wangyoucao577/go-release-action@v1.55
      name: Go build binaries and upload to release
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        extra_files: LICENSE.txt
        pre_command: "go mod tidy"
        binary_name: golang-slp-server
        release_tag: ${{ github.ref_name }}
        overwrite: true
        

    
